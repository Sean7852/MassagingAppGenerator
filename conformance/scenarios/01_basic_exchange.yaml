name: basic_exchange
description: >
  Alice and Bob are both online and send each other a message
  (steps 1 and 2 of the assignment scenario).
clients: [alice, bob]
steps:
  - alice: /login alice
  - alice?: LOGGED_IN name=alice
  - bob: /login bob
  - bob?: LOGGED_IN name=bob
  - alice: /send bob Hi Bob, I have something important to tell you
  - alice?: SENT id={a1} seq={s1} to=bob
  - bob?: RECV seq={s1} id={a1} from=alice text=Hi Bob, I have something important to tell you
  - bob: /send alice What is it?
  - bob?: SENT id={b1} seq={s2} to=alice
  - alice?: RECV seq={s2} id={b1} from=bob text=What is it?
  - alice?none: 300
  - bob?none: 300
