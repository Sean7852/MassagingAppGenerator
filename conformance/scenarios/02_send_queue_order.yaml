name: send_queue_order
description: >
  Messages queued while offline go out one at a time, oldest first, after /online. The sender
  sees SENT in queue order and the receiver sees RECV in the same order, ids and seqs.
clients: [alice, bob]
steps:
  - bob: /login bob
  - bob?: LOGGED_IN name=bob
  - alice: /login alice
  - alice?: LOGGED_IN name=alice
  - alice: /offline
  - alice?: OFFLINE
  - alice: /send bob one
  - alice?: QUEUED id={m1} to=bob
  - alice: /send bob two
  - alice?: QUEUED id={m2} to=bob
  - alice: /send bob three
  - alice?: QUEUED id={m3} to=bob
  - alice: /send bob four
  - alice?: QUEUED id={m4} to=bob
  - bob?none: 300
  - alice: /online
  - alice?: LOGGED_IN name=alice
  # Receipts arrive while the queue is still being sent, so READ lines may come between
  # SENT lines (spec/extensions/10-read-receipts.md, Timing).
  - alice?any:
      - SENT id={m1} seq={s1} to=bob
      - SENT id={m2} seq={s2} to=bob
      - SENT id={m3} seq={s3} to=bob
      - SENT id={m4} seq={s4} to=bob
      - READ id={m1} seq={s1} by=bob
      - READ id={m2} seq={s2} by=bob
      - READ id={m3} seq={s3} by=bob
      - READ id={m4} seq={s4} by=bob
  - bob?: RECV seq={s1} id={m1} from=alice text=one
  - bob?: RECV seq={s2} id={m2} from=alice text=two
  - bob?: RECV seq={s3} id={m3} from=alice text=three
  - bob?: RECV seq={s4} id={m4} from=alice text=four
