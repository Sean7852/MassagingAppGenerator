name: send_queue_order
description: >
  Several sends typed at once go out one at a time, in order. The sender sees SENT in typing
  order and the receiver sees RECV in the same order with the same ids and seqs.
clients: [alice, bob]
steps:
  - bob: /login bob
  - bob?: LOGGED_IN name=bob
  - alice: /login alice
  - alice?: LOGGED_IN name=alice
  - alice: /send bob one
  - alice: /send bob two
  - alice: /send bob three
  - alice: /send bob four
  - alice?: SENT id={m1} seq={s1} to=bob
  - alice?: SENT id={m2} seq={s2} to=bob
  - alice?: SENT id={m3} seq={s3} to=bob
  - alice?: SENT id={m4} seq={s4} to=bob
  - bob?: RECV seq={s1} id={m1} from=alice text=one
  - bob?: RECV seq={s2} id={m2} from=alice text=two
  - bob?: RECV seq={s3} id={m3} from=alice text=three
  - bob?: RECV seq={s4} id={m4} from=alice text=four
