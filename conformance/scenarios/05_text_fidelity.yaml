name: text_fidelity
description: >
  Text is sent exactly as typed (spaces, Unicode, backslashes, tabs) and printed with the
  escaping rules of 30-cli.md. A lone CR ends a line.
clients: [alice, bob]
steps:
  - alice: /login alice
  - alice?: LOGGED_IN name=alice
  - bob: /login bob
  - bob?: LOGGED_IN name=bob
  - alice: "/send bob  two  spaces, leading and trailing "
  - alice?: SENT id={m1} seq={s1} to=bob
  - bob?: "RECV seq={s1} id={m1} from=alice text= two  spaces, leading and trailing "
  - alice: /send bob héllo 你好 👋 ünïcödé
  - alice?: SENT id={m2} seq={s2} to=bob
  - bob?: RECV seq={s2} id={m2} from=alice text=héllo 你好 👋 ünïcödé
  - alice: '/send bob back\slash and \n are not escapes'
  - alice?: SENT id={m3} seq={s3} to=bob
  - bob?: 'RECV seq={s3} id={m3} from=alice text=back\\slash and \\n are not escapes'
  - alice: "/send bob col1\tcol2"
  - alice?: SENT id={m4} seq={s4} to=bob
  - bob?: 'RECV seq={s4} id={m4} from=alice text=col1\tcol2'
  - alice: "/send bob first\r/send bob second"
  - alice?: SENT id={m5} seq={s5} to=bob
  - alice?: SENT id={m6} seq={s6} to=bob
  - bob?: RECV seq={s5} id={m5} from=alice text=first
  - bob?: RECV seq={s6} id={m6} from=alice text=second
