name: restart_and_crash
description: >
  The outbox survives a restart and a crash (killed process). After a restart the user logs
  in again, and what is still queued in that user's folder is sent. /login is refused while a
  user is logged in.
clients: [alice, bob]
steps:
  - bob: /login bob
  - bob?: LOGGED_IN name=bob
  - alice: /login alice
  - alice?: LOGGED_IN name=alice
  - alice: /offline
  - alice?: OFFLINE
  - alice: /send bob queued before a restart
  - alice?: QUEUED id={m1} to=bob
  - restart: alice
  - alice: /login alice
  - alice?: LOGGED_IN name=alice
  - alice?: SENT id={m1} seq={s1} to=bob
  - bob?: RECV seq={s1} id={m1} from=alice text=queued before a restart
  - alice?: READ id={m1} seq={s1} by=bob
  - alice: /login alice
  - alice?: ERROR code=already_logged_in message=already logged in
  - alice: /offline
  - alice?: OFFLINE
  - alice: /send bob queued before a crash
  - alice?: QUEUED id={m2} to=bob
  - crash: alice
  - alice: /login alice
  - alice?: LOGGED_IN name=alice
  - alice?: SENT id={m2} seq={s2} to=bob
  - bob?: RECV seq={s2} id={m2} from=alice text=queued before a crash
  - alice?: READ id={m2} seq={s2} by=bob
  - bob?none: 300
