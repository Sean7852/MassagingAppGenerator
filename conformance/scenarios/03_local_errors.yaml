name: local_errors
description: Commands the client rejects itself, in each state, with their exact error lines.
clients: [alice]
steps:
  # idle: no saved name
  - alice: /send bob hello
  - alice?: ERROR code=not_logged_in message=log in first with /login <name>
  - alice: /online
  - alice?: ERROR code=not_logged_in message=log in first with /login <name>
  - alice: /offline
  - alice?: ERROR code=not_logged_in message=log in first with /login <name>
  - alice: ""
  - alice?none: 300
  - alice: hello
  - alice?: ERROR code=unknown_command message=unknown command
  - alice: /sendx bob hi
  - alice?: ERROR code=unknown_command message=unknown command
  - alice: /login
  - alice?: "ERROR code=usage message=usage: /login <name>"
  - alice: /login alice extra
  - alice?: "ERROR code=usage message=usage: /login <name>"
  - alice: /send bob
  - alice?: "ERROR code=usage message=usage: /send <user> <text>"
  - alice: "/send bob "
  - alice?: "ERROR code=usage message=usage: /send <user> <text>"
  - alice: /online now
  - alice?: "ERROR code=usage message=usage: /online"
  - alice: /offline please
  - alice?: "ERROR code=usage message=usage: /offline"
  - alice: /quit now
  - alice?: "ERROR code=usage message=usage: /quit"
  # online
  - alice: /login alice
  - alice?: LOGGED_IN name=alice
  - alice: /login alice
  - alice?: ERROR code=already_logged_in message=already logged in
  - alice: /login bob
  - alice?: ERROR code=already_logged_in message=already logged in
  - alice: /online
  - alice?: ERROR code=already_online message=already online
  # offline
  - alice: /offline
  - alice?: OFFLINE
  - alice: /offline
  - alice?: ERROR code=already_offline message=already offline
  - alice: /login alice
  - alice?: ERROR code=already_logged_in message=already logged in
  - alice: /online
  - alice?: LOGGED_IN name=alice
