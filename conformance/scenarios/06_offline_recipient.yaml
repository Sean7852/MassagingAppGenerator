name: offline_recipient
description: >
  A message to a user who has never logged in is held by the server and shown right after that
  user logs in, after LOGGED_IN. Sending to yourself works (ack first, then delivery).
clients: [alice, carol]
steps:
  - alice: /login alice
  - alice?: LOGGED_IN name=alice
  - alice: /send carol are you there?
  - alice?: QUEUED id={m1} to=carol
  - alice?: SENT id={m1} seq={s1} to=carol
  - carol?none: 300
  - carol: /login carol
  - carol?: LOGGED_IN name=carol
  - carol?: RECV seq={s1} id={m1} from=alice text=are you there?
  - alice?: READ id={m1} seq={s1} by=carol
  - carol: /send carol note to self
  - carol?: QUEUED id={m2} to=carol
  - carol?: SENT id={m2} seq={s2} to=carol
  - carol?: RECV seq={s2} id={m2} from=carol text=note to self
  # No receipt for a message to yourself.
  - carol?none: 300
